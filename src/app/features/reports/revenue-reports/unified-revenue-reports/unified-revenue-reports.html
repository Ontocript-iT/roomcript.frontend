<div>
  <div class="bg-gray-50 border border-gray-200 rounded-md p-4 mb-4">
    <div class="flex flex-wrap gap-3 items-end">

      <div class="flex flex-col">
        <label class="text-xs font-medium text-gray-600 mb-1">Start Date</label>
        <input
          type="date"
          [(ngModel)]="filters.startDate"
          class="px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="flex flex-col">
        <label class="text-xs font-medium text-gray-600 mb-1">End Date</label>
        <input
          type="date"
          [(ngModel)]="filters.endDate"
          class="px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-medium text-gray-600 mb-1">Sections</label>
        <div class="relative">
          <button
            type="button"
            (click)="toggleSectionsDropdown()"
            class="px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 min-w-[220px] text-left flex items-center justify-between bg-white">
            <span class="text-gray-700 truncate">
              {{ getSelectedSectionsLabel() }}
            </span>
            <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div *ngIf="showSectionsDropdown" class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-md shadow-lg max-h-60 overflow-y-auto">
            <label *ngFor="let section of sectionOptions" class="flex items-center px-3 py-2 hover:bg-gray-50 cursor-pointer">
              <input
                type="checkbox"
                [checked]="filters.sections.includes(section.value)"
                (change)="toggleSection(section.value)"
                class="mr-2 rounded text-indigo-600 focus:ring-indigo-500">
              <span class="text-sm text-gray-700">{{ section.label }}</span>
            </label>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-2 justify-center pb-1">
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" [(ngModel)]="filters.includeYearToDate" class="rounded text-indigo-600 focus:ring-indigo-500 mr-2">
          <span class="text-sm text-gray-600">Include YTD</span>
        </label>
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" [(ngModel)]="filters.includeBudget" class="rounded text-indigo-600 focus:ring-indigo-500 mr-2">
          <span class="text-sm text-gray-600">Include Budget</span>
        </label>
      </div>

      <div class="flex gap-2 ml-auto">
        <button
          type="button"
          (click)="applyFilters()"
          class="flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-white bg-gradient-to-br from-indigo-600 to-purple-600 rounded-md hover:from-indigo-700 hover:to-purple-700 shadow-sm transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
          </svg>
          <span>Apply Filters</span>
        </button>

        <button
          type="button"
          (click)="resetFilters()"
          class="flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 shadow-sm transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>Clear</span>
        </button>

        <button
          type="button"
          (click)="exportReport()"
          [disabled]="!hasData()"
          class="flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-white bg-gradient-to-br from-indigo-600 to-purple-600 rounded-md hover:from-indigo-700 hover:to-purple-700 disabled:bg-gray-400 disabled:cursor-not-allowed shadow-sm transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <span>Export PDF</span>
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="error" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md">
    {{ error }}
  </div>

  <div *ngIf="loading" class="flex items-center justify-center p-12">
    <div class="flex flex-col items-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      <p class="mt-4 text-gray-600">Generating Report Preview...</p>
    </div>
  </div>

  <div *ngIf="!loading && !error && pdfPreviewUrl" class="bg-white border border-gray-200 rounded-md shadow-sm h-[800px] flex flex-col">

    <div class="flex-1 w-full bg-white">
      <iframe
        [src]="pdfPreviewUrl"
        class="w-full h-full border border-gray-300 rounded bg-white shadow-md"
        type="application/pdf">
      </iframe>
    </div>
  </div>

  <div *ngIf="!loading && !error && !pdfPreviewUrl"
       class="text-center py-12 bg-gray-50 rounded-md border border-gray-200">
    <p class="mt-4 text-lg font-medium text-gray-900">Ready to Generate</p>
    <p class="mt-2 text-sm text-gray-600">Apply filters to view the PDF report</p>
  </div>
</div>
